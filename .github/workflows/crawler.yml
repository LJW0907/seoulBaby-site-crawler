# .github/workflows/crawler.yml

name: Seoul Baby Info Crawler

on:
  # 1. 스케줄 실행: UTC 기준 매일 00:00 (한국 시간 오전 9시)에 자동으로 실행
  schedule:
    - cron: "0 0 * * *"

  # 2. 수동 실행: GitHub Actions 탭에서 "Run workflow" 버튼을 눌러 수동으로 실행 가능
  workflow_dispatch:

jobs:
  crawl-and-upload:
    runs-on: ubuntu-latest

    steps:
      # 1. 리포지토리의 코드를 가져옵니다.
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2. 파이썬 환경을 설정합니다.
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11" # 사용할 파이썬 버전

      # 3. 필요한 라이브러리를 requirements.txt에서 설치합니다.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 4. 파이썬 스크립트를 실행합니다.
      - name: Run Python Crawler
        # [핵심] GitHub Secrets를 환경 변수로 스크립트에 주입합니다.
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET_NAME: ${{ secrets.S3_BUCKET_NAME }}
        run: python main_crawler.py
